name: Feature request
description: Suggest an improvement or new capability
title: "[Feature]: "
labels: ["enhancement"]
body:
  - type: markdown
    attributes:
      value: |
        Describe the problem you want solved. Search [existing issues](https://github.com/cguerreroto/gdpr_anonymizer/issues) for similar requests.

  - type: textarea
    id: problem
    attributes:
      label: Problem or use case
      description: What limitation or workflow pain does this address?
    validations:
      required: true

  - type: textarea
    id: proposal
    attributes:
      label: Proposed solution
      description: How would you like this to work?
    validations:
      required: true

  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives considered
      description: Other approaches you thought about.
    validations:
      required: false

  - type: dropdown
    id: component
    attributes:
      label: Component
      options:
        - extractor / yolo_raw_extractor
        - segmentator (Rust)
        - ml_pipeline
        - documentation
        - other
    validations:
      required: true
