[project]
name = "ml-pipeline"
version = "0.1.0"
description = "Dataset audit and YOLO label layout helpers for gdpr_anonymizer"
requires-python = ">=3.11"
dependencies = [
    "pyyaml>=6.0",
]

[project.scripts]
gdpr-yolo-normalize-labels = "ml_pipeline.cli:main"
gdpr-yolo-fix-dataset-yaml = "ml_pipeline.cli_dataset_yaml:main"
gdpr-yolo-train = "ml_pipeline.cli_train:main"
gdpr-yolo-validate = "ml_pipeline.cli_validate:main"
gdpr-yolo-analyze-errors = "ml_pipeline.cli_errors:main"
gdpr-yolo-predict = "ml_pipeline.cli_predict:main"
gdpr-yolo-clean = "ml_pipeline.cli_clean:main"

# gdpr-yolo-train, gdpr-yolo-validate, gdpr-yolo-analyze-errors, and gdpr-yolo-predict: run `uv sync --extra train` in this directory.
[project.optional-dependencies]
train = ["ultralytics>=8.3"]

[build-system]
requires = ["setuptools>=61", "wheel"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[dependency-groups]
dev = ["pytest>=8.0"]

[tool.pytest.ini_options]
testpaths = ["tests"]
