[project]
name = "ml-pipeline"
version = "0.1.0"
description = "Dataset audit and YOLO label layout helpers for gdpr_anonymizer"
requires-python = ">=3.11"
dependencies = [
    "pyyaml>=6.0",
]

[project.scripts]
gdpr-yolo-normalize-labels = "ml_pipeline.cli:main"

[build-system]
requires = ["setuptools>=61", "wheel"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[dependency-groups]
dev = ["pytest>=8.0"]

[tool.pytest.ini_options]
testpaths = ["tests"]
