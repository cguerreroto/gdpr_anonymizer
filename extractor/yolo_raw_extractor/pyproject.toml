[project]
name = "yolo-raw-extractor"
version = "0.1.0"
description = "Frame sampling and dataset augmentation for gdpr_anonymizer"
readme = "README.md"
authors = [
    { name = "cguerreroto", email = "55792679+cguerreroto@users.noreply.github.com" },
    { name = "decryphe", email = "12104091+decryphe@users.noreply.github.com" },
]
license = "PolyForm-Noncommercial-1.0.0"
requires-python = ">=3.13"
dependencies = [
    "opencv-python>=4.12.0.88",
    "pyyaml>=6.0.3",
]

[project.scripts]
yolo-raw-extractor = "yolo_raw_extractor:main"
yolo-segment-extractor = "yolo_raw_extractor.segments:main"
yolo-augmentor = "yolo_raw_extractor.augment:main"
yolo-bbox-import = "yolo_raw_extractor.box_to_segment_import:main"

[dependency-groups]
dev = ["pytest>=8.0", "py-spy>=0.4"]

[build-system]
requires = ["uv_build>=0.9.13,<0.10.0"]
build-backend = "uv_build"
